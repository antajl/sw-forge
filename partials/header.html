  <!-- HEADER -->
  <header class="site-header">
    <div class="header-shell">
      <div class="header-row header-row--nav">
        <div class="header-brand">
          <a class="logo" href="./" id="site-logo-link" aria-label="SW Forge">
            <img class="logo__img" src="assets/logo.png" width="320" height="48" alt="" decoding="async" />
          </a>
        </div>
        <button type="button" class="header-nav-toggle" id="header-nav-toggle" aria-expanded="false" aria-controls="main-tabs-panel" title="Menu">
          <svg class="header-nav-toggle__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
          <span class="sr-only" id="lbl-header-nav-toggle">Menu</span>
        </button>
        <div class="tabs-scroll" id="main-tabs-panel" aria-label="Main navigation">
          <nav class="tabs" id="main-tabs-nav">
            <span class="tabs__indicator" aria-hidden="true"></span>
            <button type="button" class="tab" data-tab="dashboard" title="Dashboard">
              <span class="tab__icon" aria-hidden="true">
                <svg class="tab__icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
              </span>
              <span class="tab__label" id="lbl-tab-dashboard">Dashboard</span>
            </button>
            <button type="button" class="tab" data-tab="gear" title="Gear">
              <span class="tab__icon" aria-hidden="true">
                <span class="tab__icon-mask tab__icon-mask--runes"></span>
              </span>
              <span class="tab__label" id="lbl-tab-runes">Gear</span>
            </button>
            <button type="button" class="tab" data-tab="monsters" title="Monsters">
              <span class="tab__icon" aria-hidden="true">
                <span class="tab__icon-mask tab__icon-mask--monsters"></span>
              </span>
              <span class="tab__label" id="lbl-tab-monsters">Monsters</span>
            </button>
            <button type="button" class="tab" data-tab="guide" data-share-hidden="1" title="Guide">
              <span class="tab__icon" aria-hidden="true">
                <svg class="tab__icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                </svg>
              </span>
              <span class="tab__label">Guide</span>
            </button>
            <button type="button" class="tab" data-tab="changelog" data-share-hidden="1" title="Updates">
              <span class="tab__icon" aria-hidden="true">
                <svg class="tab__icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M12 8v4l3 3" />
                  <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" />
                </svg>
              </span>
              <span class="tab__label">Updates</span>
            </button>
            <button type="button" class="tab" data-tab="app-settings" title="Settings">
              <span class="tab__icon" aria-hidden="true">
                <svg class="tab__icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
              </span>
              <span class="tab__label">Settings</span>
            </button>
          </nav>
        </div>
        <div class="header-corner-cluster">
          <div class="header-lang" id="header-lang-wrap">
            <label class="sr-only" id="lbl-header-language">Language</label>
            <button
              type="button"
              class="header-lang__btn"
              id="header-lang-btn"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="header-lang-menu"
              title="Language"
            >
              <svg class="header-lang__svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
              </svg>
            </button>
            <div class="header-lang__menu" id="header-lang-menu" role="menu" hidden>
              <button type="button" class="header-lang__option" role="menuitemradio" data-lang="en">English</button>
              <button type="button" class="header-lang__option" role="menuitemradio" data-lang="ru">Русский</button>
              <button type="button" class="header-lang__option" role="menuitemradio" data-lang="fr">Français</button>
              <button type="button" class="header-lang__option" role="menuitemradio" data-lang="zh">中文</button>
            </div>
            <select id="app-language" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="en">English</option>
              <option value="ru">Русский</option>
              <option value="fr">Français</option>
              <option value="zh">中文</option>
            </select>
          </div>
          <div class="header-donate-group">
            <button type="button" class="header-theme-btn header-theme-btn--wide" id="header-donate-btn">
              <svg class="header-theme-icon header-donate-heart" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
              <span id="lbl-header-donate">Donate</span>
            </button>
          </div>
          <div class="header-theme-group" id="header-theme-group">
            <button type="button" class="theme-toggle is-dark" id="theme-toggle" aria-pressed="false" title="Light theme" aria-label="Light theme">
              <span class="theme-toggle__track">
                <span class="theme-toggle__thumb" aria-hidden="true"></span>
                <svg class="theme-toggle__icon theme-toggle__icon--sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="4" fill="currentColor" />
                  <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m12.02-12.02 1.41-1.41" />
                </svg>
                <svg class="theme-toggle__icon theme-toggle__icon--moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <aside id="demo-dataset-banner" class="demo-dataset-banner" hidden aria-hidden="true">
    <div class="demo-dataset-banner__inner">
      <div class="demo-dataset-banner__content">
        <span class="demo-dataset-banner__badge" aria-hidden="true"></span>
        <span class="demo-dataset-banner__text"></span>
        <button type="button" class="btn-ghost demo-dataset-banner__upload-btn" id="demo-banner-upload-btn"></button>
        <button type="button" class="demo-dataset-banner__dismiss" id="demo-banner-dismiss" aria-label="Dismiss">&times;</button>
      </div>
    </div>
  </aside>
